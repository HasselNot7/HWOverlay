<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Console Hardware Monitor Overlay</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap");

    :root {
      --console-font: "JetBrains Maple Mono", "JetBrains Mono", monospace;
      --fallback-fonts: "Noto Sans SC", sans-serif;

      /* Nord Console 配色方案 */
      --bg-color: #1b1d24;
      --prompt-user: #d08770;
      --prompt-symbol: #81a1c1;
      --label-color: #ebcb8b;
      --text-color: #eceff4;
      --dim-color: #cdd6e4;
      --chip-label: #8fbcbb;
      --subtext-color: #4c566a;   /* 只用于进度条底槽，深色底上不做文字色 */

      --bar-bg: #2e3440;
      --bar-fill: #a3be8c;
      --bar-high: #bf616a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--console-font), var(--fallback-fonts) !important;
    }

    body {
      /* 宽高由 overlay 配置的 canvas 决定，这里只是兜底 */
      width: 2000px;
      height: 170px;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 24px;
    }

    /* AIDA64 数据断了就把整条压暗，直播时一眼能看出来 */
    body.offline { opacity: 0.45; }

    /* 只剩 Windows 自带指标：轻度提示，数字还在动，不能压太暗 */
    body.degraded { opacity: 0.75; }

    .prompt-line {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prompt-user { color: var(--prompt-user); }
    .prompt-symbol { color: var(--prompt-symbol); }
    .prompt-cmd { color: var(--text-color); }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 20px;
      background-color: var(--text-color);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* minmax(0,1fr) 是必需的：默认 1fr 的最小宽度等于内容宽度，
       长文本会把列撑宽去挤相邻卡片，还会让溢出判据量到一个跟着变大的 room */
    .monitor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 32px;
    }

    .metric-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .metric-header { display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; }
    .metric-label { color: var(--label-color); }
    .metric-value { color: var(--text-color); }

    .progress-bar-container { display: flex; align-items: center; gap: 8px; font-size: 15px; }
    .progress-track {
      flex: 1;
      height: 13px;
      background-color: var(--bar-bg);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--bar-fill);
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    .metric-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--dim-color);
      white-space: nowrap;
      overflow: hidden;
    }
    /* span 必须是滚动容器，否则 scrollWidth 恒等于 clientWidth，测不出真实内容宽度 */
    .metric-sub > span { overflow: hidden; }
    /* 值变宽时（显存 10.0GB、核心 2000MHz）降一号，宁可小一点也不越界压到相邻卡片 */
    .metric-card.tight .metric-sub { font-size: 12.5px; }

    .spark {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      flex: 0 0 82px;
      height: 17px;
      background-color: var(--bar-bg);
      padding: 1px;
    }
    .spark i { flex: 1; min-height: 1px; background-color: var(--bar-fill); transition: height 0.3s ease; }

    .chips { display: flex; justify-content: space-between; gap: 18px; margin-top: 10px; font-size: 15px; }
    .chips.dense { font-size: 13px; gap: 10px; }
    .chip { flex: 0 0 auto; display: flex; gap: 6px; white-space: nowrap; overflow: hidden; }
    .chip b { color: var(--chip-label); font-weight: 400; }
    .chip span { color: var(--text-color); }
    .chip.warn span { color: var(--bar-high); }
  </style>
</head>
<body>
  <script>
    // 配置驱动的叠加层渲染器。三层数据来源：
    //   /hw.json      值，按输出路径取（cpu.usage）
    //   /metrics.json 怎么解读：单位、位数、量程、阈值、中文名
    //   /overlay.json 显示哪些、摆在哪
    // 本文件不含任何指标清单或阈值 —— 那些都是数据。

    const REFRESH_MS = 1000;
    const HISTORY = 22;       // 迷你曲线秒数
    const SPARK_W = 82;       // 与 CSS .spark 的 flex-basis 一致
    const SUB_GAP = 8;        // 与 CSS .metric-sub 的 gap 一致
    const SUB_FONT_PX = 14;   // 与 CSS .metric-sub 的 font-size 一致

    let HW = null;
    let chipHost = null;
    let chipSpecs = [];
    const byOut = new Map();  // 输出路径 -> 注册表条目
    const cards = {};
    const history = {};       // 指标路径 -> 采样数组

    const probe = document.createElement('span');
    probe.style.cssText =
      `position:absolute;left:-9999px;visibility:hidden;white-space:nowrap;font-size:${SUB_FONT_PX}px`;

    const dig = (obj, path) => path.split('.').reduce((n, k) => (n == null ? null : n[k]), obj);
    const asRef = r => (typeof r === 'string' ? { metric: r } : r);

    function meta(r) {
      const m = byOut.get(r.metric) || {};
      return {
        unit: r.unit !== undefined ? r.unit : m.unit,
        digits: r.digits !== undefined ? r.digits : (m.digits || 0),
        divide: r.divide !== undefined ? r.divide : (m.divide || 1),
        warn: m.warn || null,
        range: m.range || null,
        name: r.name || m.name || r.metric,
      };
    }

    // 单位前加空格，% 除外：40 °C / 54.3 W / 38%
    function txt(v, mt) {
      if (v == null) return '--';
      const s = (v / mt.divide).toFixed(mt.digits);
      return mt.unit == null ? s : (mt.unit === '%' ? s + '%' : s + ' ' + mt.unit);
    }

    function plain(v, mt) {
      return v == null ? '--' : (v / mt.divide).toFixed(mt.digits);
    }

    function one(o, showUnit, showLabel) {
      const mt = meta(o);
      const v = HW ? dig(HW, o.metric) : null;
      const body = showUnit ? txt(v, mt) : plain(v, mt);
      return (showLabel && o.label ? o.label + ' ' : '') + body;
    }

    function pairText(o) {
      const vals = o.pair.map(p => (HW ? dig(HW, p) : null));
      if (vals.every(v => v == null)) return null;
      const d = o.divide || 1;
      const a = vals[0] == null ? '--' : (vals[0] / d).toFixed(o.digits || 0);
      const b = vals[1] == null ? '--' : (vals[1] / d).toFixed(o.digits2 !== undefined ? o.digits2 : (o.digits || 0));
      return `${o.label ? o.label + ' ' : ''}${a}/${b}${o.unit || ''}`;
    }

    function diffText(o) {
      const [a, b] = o.diff.map(p => (HW ? dig(HW, p) : null));
      if (a == null || b == null) return null;
      return txt(a - b, meta({ unit: o.unit, digits: o.digits, divide: o.divide }));
    }

    // 组级 unit/digits/divide 作为条目默认值，条目自己写了才覆盖
    function group(def, showLabel) {
      if (!def) return null;
      const base = { unit: def.unit, digits: def.digits, divide: def.divide };
      const last = (def.metrics || []).length - 1;
      const parts = (def.metrics || []).map((raw, i) => {
        const o = { ...base, ...asRef(raw) };
        if (o.pair) return pairText(o);
        if (o.diff) return diffText(o);
        return one(o, def.unit_policy !== 'last' || i === last, showLabel);
      });
      const kept = parts.filter(s => s && s !== '--');
      return kept.length ? kept.join(def.sep || ' · ') : null;
    }

    function isHigh(v, warn) {
      if (v == null || !warn) return false;
      return warn.op === '<=' ? v <= warn.value : v >= warn.value;
    }

    function el(tag, cls, children) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      for (const k of children || []) node.appendChild(k);
      return node;
    }
    const text = s => document.createTextNode(s);

    function build(layout) {
      if (layout.canvas) {
        document.body.style.width = layout.canvas.w + 'px';
        document.body.style.height = layout.canvas.h + 'px';
      }
      if (layout.prompt) {
        const p = layout.prompt;
        const line = el('div', 'prompt-line', [
          el('span', 'prompt-user', [text(p.user)]),
          el('span', 'prompt-symbol', [text('>'),]),
          el('span', 'prompt-cmd', [text(p.cmd)]),
        ]);
        if (p.cursor) line.appendChild(el('div', 'cursor'));
        document.body.appendChild(line);
      }
      for (const row of layout.rows || []) {
        if (row.type === 'cards') document.body.appendChild(buildCards(row));
        else if (row.type === 'chips') { chipHost = buildChips(row); document.body.appendChild(chipHost); }
      }
      document.body.appendChild(probe);
    }

    function buildCards(row) {
      const grid = el('div', 'monitor-grid');
      grid.style.gridTemplateColumns = `repeat(${row.cols}, minmax(0, 1fr))`;
      grid.style.gap = row.gap + 'px';
      for (const c of row.items) {
        const card = el('div', 'metric-card');
        card.dataset.key = c.key;
        const value = el('span', 'metric-value', [text('--')]);
        const bar = el('div', 'progress-fill');
        const subText = el('span', null, [text('--')]);
        const spark = el('div', 'spark');
        card.appendChild(el('div', 'metric-header',
          [el('span', 'metric-label', [text(c.label)]), value]));
        card.appendChild(el('div', 'progress-bar-container', [
          el('span', null, [text('[')]),
          el('div', 'progress-track', [bar]),
          el('span', null, [text(']')]),
        ]));
        card.appendChild(el('div', 'metric-sub', [spark, subText]));
        grid.appendChild(card);
        cards[c.key] = { el: card, value, bar, subText, spark,
                         barMetric: c.bar, barFull: c.bar_full,
                         valueDef: c.value, subDef: c.sub, sparkMetric: c.spark };
        if (c.spark) history[c.spark] = [];
      }
      return grid;
    }

    function buildChips(row) {
      chipSpecs = (row.items || []).map(asRef);
      const host = el('div', 'chips');
      host.dataset.fit = row.fit || 'none';
      return host;
    }

    function renderCards() {
      for (const key of Object.keys(cards)) {
        const c = cards[key];
        c.value.textContent = group(c.valueDef, false) || '--';
        c.subText.textContent = group(c.subDef, true) || '--';

        const m = byOut.get(c.barMetric) || {};
        const v = HW ? dig(HW, c.barMetric) : null;
        const max = c.barFull !== undefined ? c.barFull : (m.range ? m.range[1] : 100);
        const min = m.range ? m.range[0] : 0;
        const pct = v == null ? 0 : Math.max(0, Math.min(100, (v - min) / (max - min) * 100));
        c.bar.style.width = pct + '%';
        c.bar.style.backgroundColor = isHigh(v, m.warn) ? 'var(--bar-high)' : 'var(--bar-fill)';

        // 次要行宽度随数值变（显存 10.0GB、核心 2000MHz），放不下就降一号。
        // 用隐藏探针恒按正常字号量：直接量元素会在 14px/12.5px 两种状态间来回跳。
        probe.textContent = c.subText.textContent;
        const room = c.subText.parentElement.clientWidth - SPARK_W - SUB_GAP;
        c.el.classList.toggle('tight', probe.scrollWidth > room);

        if (c.sparkMetric) {
          const h = history[c.sparkMetric];
          h.push(HW ? dig(HW, c.sparkMetric) : null);
          while (h.length > HISTORY) h.shift();
          drawSpark(c.spark, h, (byOut.get(c.sparkMetric) || {}).warn);
        }
      }
    }

    function drawSpark(host, hist, warn) {
      if (host.children.length !== hist.length) {
        host.replaceChildren(...hist.map(() => document.createElement('i')));
      }
      const seen = hist.filter(v => v != null);
      // 按窗口内峰值定标，否则 20% 的负载只有 2px 高，看不出形状
      const peak = Math.max(20, ...seen);
      hist.forEach((v, i) => {
        const cell = host.children[i];
        cell.style.height = v == null ? '0%' : Math.max(2, v / peak * 100) + '%';
        cell.style.backgroundColor = isHigh(v, warn) ? 'var(--bar-high)' : 'var(--bar-fill)';
      });
    }

    function chipText(s) {
      const v = HW ? dig(HW, s.metric) : null;
      return v == null ? null : { value: v, text: txt(v, meta(s)) };
    }

    function renderChips() {
      if (!chipHost) return;
      const html = [];
      for (const s of chipSpecs) {
        const mt = meta(s);
        const r = chipText(s);
        if (!r) continue;
        html.push(`<div class="chip${isHigh(r.value, mt.warn) ? ' warn' : ''}">` +
                  `<b>${mt.name}</b><span>${r.text}</span></div>`);
      }
      chipHost.innerHTML = html.join('');
      if (chipHost.dataset.fit === 'shrink') {
        // 传感器数量变了会挤爆这一行，缩一号也比裁掉好
        chipHost.classList.toggle('dense', chipHost.scrollWidth > chipHost.clientWidth);
      }
    }

    function render() {
      document.body.classList.toggle('offline', !HW);
      document.body.classList.toggle('degraded', !!(HW && HW.degraded));
      renderCards();
      renderChips();
    }

    async function getJSON(url) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(url + ' -> ' + r.status);
      return r.json();
    }

    async function tick() {
      try { HW = await getJSON('/hw.json?_=' + Date.now()); } catch (e) { HW = null; }
      render();
    }

    async function boot() {
      const [layout, metrics] = await Promise.all([getJSON('/overlay.json'), getJSON('/metrics.json')]);
      for (const m of metrics.metrics) if (m.out) byOut.set(m.out, m);
      build(layout);
      await tick();
      setInterval(tick, REFRESH_MS);
    }

    boot();
  </script>
</body>
</html>
