<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HWOverlay 管理</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">HWOverlay<small>直播硬件叠加层</small></div>

    <nav id="nav">
      <button data-view="start" class="active">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M6.5 5.5v5L11 8z"/></svg>开始使用</button>
      <button data-view="status">
        <svg viewBox="0 0 16 16"><path d="M1 8.5h3l2-5 3.5 9 2-4H15"/></svg>状态总览</button>
      <button data-view="editor">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><path d="M9 11.5h5.5M11.75 9v5.5"/></svg>版式编辑</button>
      <button data-view="custom">
        <svg viewBox="0 0 16 16"><path d="M8 1.5v13M1.5 8h13"/><circle cx="8" cy="8" r="6.5"/></svg>自定义指标</button>
      <button data-view="metrics">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h8"/></svg>指标总表</button>
    </nav>

    <div class="side-foot">
      <label class="side-auto"><input type="checkbox" id="auto" checked> 自动刷新</label>
      <button id="refresh">刷新数据</button>
      <a class="ghost" href="/" target="_blank">打开叠加层 ↗</a>
    </div>
  </aside>

  <main id="content">
    <section class="view" id="view-start">
      <h2 class="view-title">开始使用</h2>
      <section id="wizard" class="card">
        <div class="body"><ol class="steps" id="w-steps"><li>检测中…</li></ol></div>
      </section>
    </section>

    <section class="view" id="view-status">
      <h2 class="view-title">状态总览</h2>
      <div class="status-grid">
        <section id="sources" class="card"><h2>数据源</h2><div class="body">载入中…</div></section>
        <section id="budget" class="card"><h2>导出预算</h2><div class="body">载入中…</div></section>
      </div>
      <section id="obs" class="card"><h2>OBS 里怎么填</h2><div class="body">载入中…</div></section>
    </section>

    <section class="view" id="view-editor">
      <h2 class="view-title">版式编辑</h2>
      <section id="check" class="card"><h2>版式校验</h2><div class="body">载入中…</div></section>
      <section id="editor" class="card">
        <h2>编辑器</h2>
        <div class="body">
          <p class="hint"><b>怎么玩</b>：部件从上往下排，就是叠加层从上到下的样子。
          点 <b>保存</b> 后下面的预览会刷新；确认效果后，再到 OBS 浏览器源里点一次"刷新缓存"即可生效。</p>
          <div class="form">
            <label>叠加层宽 <input type="number" id="e-w" min="200" max="4000" step="10"></label>
            <label>叠加层高 <input type="number" id="e-h" min="60" max="1000" step="1"></label>
            <span class="src">这两个数要和 OBS 浏览器源里填的宽高一致。</span>
          </div>
          <div id="e-widgets"></div>
          <div class="savebar">
            <button id="e-save" class="primary" disabled>保存</button>
            <button id="e-undo">还原上一版</button>
            <span id="e-dirty"></span>
            <span class="spacer"></span>
            <span id="e-msg"></span>
          </div>
        </div>
      </section>
      <section id="preview" class="card"><h2>预览</h2><div class="body">
        <div class="pv-wrap" id="pv-wrap"><iframe id="pv" title="叠加层预览" scrolling="no"></iframe></div>
        <div class="src" id="pv-note">预览缩放比例跟随窗口宽度。</div>
      </div></section>
    </section>

    <section class="view" id="view-custom">
      <h2 class="view-title">自定义指标</h2>
      <section id="unknown" class="card"><h2>未知传感器</h2><div class="body">载入中…</div></section>
    </section>

    <section class="view" id="view-metrics">
      <h2 class="view-title">指标总表</h2>
      <section id="metrics" class="card"><h2>指标总表</h2><div class="body">载入中…</div></section>
    </section>
  </main>

  <script type="module" src="/admin.js"></script>
</body>
</html>
