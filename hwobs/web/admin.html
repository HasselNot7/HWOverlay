<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HWOverlay 管理</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header>
    <h1>HWOverlay <span>直播硬件叠加层</span></h1>
    <div class="tools">
      <label><input type="checkbox" id="auto" checked> 自动刷新</label>
      <button id="refresh">刷新</button>
      <a class="ghost" href="/" target="_blank">打开叠加层</a>
    </div>
  </header>

  <main>
    <section id="sources" class="card"><h2>数据源</h2><div class="body">载入中…</div></section>
    <section id="budget" class="card"><h2>导出预算</h2><div class="body">载入中…</div></section>
    <section id="obs" class="card"><h2>OBS 里怎么填</h2><div class="body">载入中…</div></section>
  </main>

  <section id="check" class="card"><h2>版式校验</h2><div class="body">载入中…</div></section>

  <section id="editor" class="card">
    <h2>编辑</h2>
    <div class="body">
      <div class="form">
        <label>宽 <input type="number" id="e-w" min="200" max="4000" step="10"></label>
        <label>高 <input type="number" id="e-h" min="60" max="1000" step="1"></label>
        <label>每行卡片数 <input type="number" id="e-cols" min="1" max="6" step="1"></label>
      </div>
      <div id="e-labels" class="form"></div>
      <h3>底部小指标</h3>
      <div id="e-chips" class="chips-edit"></div>
      <div class="savebar">
        <button id="e-save" disabled>保存</button>
        <button id="e-undo">还原上一版</button>
        <span id="e-msg"></span>
      </div>
    </div>
  </section>

  <section id="preview" class="card"><h2>预览</h2><div class="body">
    <div class="pv-wrap"><iframe id="pv" title="叠加层预览" scrolling="no"></iframe></div>
    <div class="src">预览按 45% 缩放显示真实的 2000×170 叠加层。</div>
  </div></section>

  <section id="metrics" class="card"><h2>指标</h2><div class="body">载入中…</div></section>

  <script type="module" src="/admin.js"></script>
</body>
</html>
